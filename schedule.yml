# COMP 440 schedule — single source of truth.
#
# You never type a meeting date. The calendar block below derives all 28 rows
# (Tue/Thu from `first` to `last`). Breaks are entries in the `meetings` list,
# so cancelling or inserting a class re-flows everything after it automatically.

course:
  code: COMP 440
  title: Collective Intelligence
  term: Fall 2026
  institution: Macalester College
  meets: Tuesday / Thursday, 1:20–2:50pm Central

calendar:
  days: [Tue, Thu]
  first: 2026-09-08
  last: 2026-12-10
  # ONE deadline for everything: homework, project milestones, reading
  # reflections, speaker questions, forms. Stated here, rendered in the Due
  # column heading, and never repeated on a row. If some future item ever needs
  # a different time, give it its own `time:` and the build will annotate that
  # row alone.
  due_time: 8:00am Central

# Speaker days: the questions are forwarded to the speaker that morning, so they
# are due on the day of the visit, not the meeting before (instructor-confirmed
# Sep 7). `when` may be visit_day or prior_meeting. `items` are placed on every
# speaker row, in order; an empty list places nothing. No `due_time` — it
# inherits calendar.due_time like everything else.
speaker_due:
  when: visit_day
  items:
    - { label: Speaker questions due }

# Reading reflections. The obligation comes from the READING, not from the day —
# so a reflection deadline is placed by each entry in `readings:` below, and a
# meeting with no assigned reading correctly shows none.
reflections:
  form_url: "https://docs.google.com/forms/d/1vX-z6k7iQbH7BWE5OgdcpLw0hmxBl2FWvoOZivI3xjU/viewform"

# One entry per assigned reading. `date` is validated against the derived meeting
# grid like every other deadline. Renders in the Due column as
# `Read <cite> [paper | reflection]`.
readings:
  - date: 2026-09-10
    cite: 'Keshav et al, "How to Read a Paper"'
    url: "http://ccr.sigcomm.org/online/files/p83-keshavA.pdf"

# Deadlines are declared here, once. The build joins them onto the grid above
# and fails if one no longer lands on a class meeting.
assignments:
  - id: hw0
    title: HW0 — Working With Data and Claude
    launch: 2026-09-10
    due: 2026-09-17
  - id: hw1
    title: HW1 — Collective Prediction
    launch: 2026-09-15
    due: 2026-09-29
  - id: hw2
    title: HW2 — Representing and Retrieving Knowledge
    launch: 2026-09-29
    due: 2026-10-13
  - id: hw3
    title: HW3 — Whose Preferences Count?
    launch: 2026-10-27
    due: 2026-11-10
  - id: hw4
    title: HW4 — Building and Evaluating an Agent
    launch: 2026-11-10
    due: 2026-11-19

milestones:
  - { date: 2026-10-13, label: Final project introduced }
  - { date: 2026-11-12, label: Final project proposal due }
  - { date: 2026-11-24, label: Final project update }
  - { date: 2026-12-03, label: Project rehearsal }
  - { date: 2026-12-08, label: Final presentation materials }
  - { date: 2026-12-10, label: Final presentation materials }

other_due:
  - { date: 2026-09-10, label: Beginning-of-semester survey, url: "https://docs.google.com/forms/d/1V2s-wjjvZy4EY8aB25mUfXf2cqgGiPgcbaXVjErRsiM/viewform" }

