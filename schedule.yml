  # entry. Declare it here, never on a meeting row.
  - id: hw0
    title: HW0 — Working With Data and Claude
    launch: 2026-09-10
    due: 2026-09-17
    url: "https://github.com/shilad/comp440-hw0"
  - id: hw1
    title: HW1 — Collective Prediction
    launch: 2026-09-15
    due: 2026-10-01
    url: "https://github.com/shilad/comp440-hw1"
  # The Sep 24 in-class activity. Due date, "individual" and "counts as one
  # reading reflection or activity" are the README's, set by the instructor
  # Sep 23 night. Submitted through the form's "Activity submission" option.
  - id: ratings-influence
    title: "Activity — Ratings and Social Influence, a simulated market with Claude"
    label: Ratings and Social Influence activity due
    kind: activity
    launch: 2026-09-24
    due: 2026-10-06
    url: "https://github.com/shilad/comp440-ratings-influence"
  # Launch moves off Sep 29 because that day is now a whole-day guest speaker
  # with no class time to introduce an assignment. Due date skips Oct 15, which
  # is Fall Break, so the next legal deadline is Oct 20.
  - id: hw2
    title: HW2 — Representing and Retrieving Knowledge
    launch: 2026-10-01
    due: 2026-10-20
  - id: hw3
    title: HW3 — Whose Preferences Count?
    launch: 2026-10-29
    due: 2026-11-10
  - id: hw4
    title: HW4 — Building and Evaluating an Agent
    launch: 2026-11-10
    due: 2026-11-19

milestones:
