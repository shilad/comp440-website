# COMP 440 schedule — single source of truth.
#
# You never type a meeting date. The calendar block below derives all 28 rows
# (Tue/Thu from `first` to `last`). Breaks are entries in the `meetings` list,
# so cancelling or inserting a class re-flows everything after it automatically.

course:
  code: COMP 440
  title: Collective Intelligence
  term: Fall 2026
  institution: Macalester College
  meets: Tuesday / Thursday, 1:20–2:50pm Central

# Course-level links, rendered as a row under the subtitle on every build. These are
# the things students need all semester and should never have to hunt for inside a
# meeting's materials cell. Order is by how often they are used, not importance.
# `url` only — these are not tied to a meeting, so no date validation applies.
# THE submission form — one surface for everything students hand in: homework,
# seminar reflections, reading reflections, speaker questions (instructor, Sep 8).
# Declared once here as a YAML anchor and referenced everywhere with `*submit`,
# so the links row, the speaker rows and every reading cannot drift apart. To
# change the form, change this line only.
submit_form: &submit "https://forms.gle/mgKcnqzTGxNaGvteA"

links:
  - { text: Submit work, url: *submit }
  - { text: Syllabus, url: "https://docs.google.com/document/d/1I1aXkTStnQKPQGWRKp3_M79QWn5x0wKLbJn8dGIZ7hU/edit" }
  - { text: AI guidelines, url: "https://docs.google.com/document/d/1Eb6qxeS2wy-9TBzL8eGk9j75iYu_yEV4VoLQaywRz8E/edit" }
  - { text: Office hours, url: "https://app.reclaim.ai/m/shilad/appointment" }
  # app_redirect resolves a channel by NAME, so this needs no channel ID and
  # survives the channel being recreated. Opens the desktop app if installed.
  - { text: "Slack #comp440-f26", url: "https://devgarden.slack.com/app_redirect?channel=comp440-f26" }

calendar:
  days: [Tue, Thu]
  first: 2026-09-08
  last: 2026-12-10
  # ONE deadline for everything: homework, project milestones, reading
  # reflections, speaker questions, forms. Stated here, rendered in the Due
  # column heading, and never repeated on a row. If some future item ever needs
  # a different time, give it its own `time:` and the build will annotate that
  # row alone.
  due_time: 8:00am Central

# Speaker days: the questions are forwarded to the speaker that morning, so they
# are due on the day of the visit, not the meeting before (instructor-confirmed
# Sep 7). `when` may be visit_day or prior_meeting. `items` are placed on every
# speaker row, in order; an empty list places nothing. No `due_time` — it
# inherits calendar.due_time like everything else.
speaker_due:
  when: visit_day
  items:
    - { label: Speaker questions due, url: *submit }

# Reflections. The obligation comes from the READING, not from the day — so a
# reflection deadline is placed by each entry in `readings:` below, and a meeting
# with no assigned reading correctly shows none.
reflections:
  form_url: *submit

# Prefilling the form. The short link above cannot carry parameters, so the long
# responder URL is declared here, once, alongside the three field ids. Ids read out
# of the published form on Sep 19, not guessed: the Forms API question ids are NOT
# the prefill ids, and converting one to the other gives a wrong number.
#
# build.py composes the query string; no row ever writes a prefilled URL by hand.
# A value that no longer matches an option prefills nothing and the student picks
# from the dropdown as before, so drift degrades rather than misfiles.
form_prefill:
  responder: "https://docs.google.com/forms/d/e/1FAIpQLSeNtCoAhKUlN2Gi35X1iTyAaSF90hesSTAgKzY_0mCrpLM7sw/viewform"
  kind_field: "entry.2143958185"
  reading_field: "entry.1946650698"
  speaker_field: "entry.1392500623"
  reading_kind: "Reading reflection"
  speaker_kind: "Speaker preparation questions"

# One entry per assigned reading. `date` is validated against the derived meeting
# grid like every other deadline. Renders in the Due column as
# `Read <cite> [paper | reflection]`.
readings:
  - date: 2026-09-10
    form_option: "Sep 10 (Thu) — Keshav, How to Read a Paper,"
    cite: 'Keshav et al, "How to Read a Paper"'
    url: "http://ccr.sigcomm.org/online/files/p83-keshavA.pdf"
  # NYT gift link: the `unlocked_article_code` is what lets students read it
  # without a subscription, so it must be kept intact. Gift links expire, and
  # this page is public — if it stops working, get a fresh one from the
  # instructor rather than dropping the parameter.
  - date: 2026-09-15
    form_option: "Sep 15 (Tue) — New York Times, OpenAI and the Navier-Stokes problem"
    cite: 'New York Times on OpenAI and the Navier-Stokes problem (Sep 10, 2026)'
    label: article
    url: "https://www.nytimes.com/2026/09/10/science/tristan-buckmaster-openai-math-navier-stokes.html?unlocked_article_code=1.AFE.0psT.2Ar5a-FHIo9p"
  - date: 2026-09-22
    form_option: "Sep 22 (Tue) — Steck et al, Deep Learning for Recommender Systems: A Netflix Case Study"
    cite: 'Steck, Baltrunas, Elahi, Liang, Raimond & Basilico, "Deep Learning for Recommender Systems: A Netflix Case Study" (AI Magazine, 2021)'
    url: "https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/18140"
  # Moved from Sep 22 with the cultural-markets session (instructor, Sep 17).
  # Nothing orphaned: no reflection had been submitted against the Sep 22 option.
  - date: 2026-09-24
    form_option: "Sep 24 (Thu) — Salganik et al, Inequality and Unpredictability in an Artificial Cultural Market"
    cite: 'Salganik, Dodds & Watts, "Experimental Study of Inequality and Unpredictability in an Artificial Cultural Market"'
    url: "https://www.filosofitis.com.ar/archivos/experimentalmarket.pdf"
  # Assigned Oct 13 (instructor), the day it was introduced in class; the
  # reflection is due the next class, Oct 20. Authors and title as the page
  # credits them when fetched Oct 13 (HTTP 200); the page shows no date.
  # `form_option` matches the dropdown option added to the form the same day.
  # Oct 19 (instructor): the Plan A discussion and this reflection move from
  # Tue Oct 20 to Thu Oct 22; Oct 20 is the retrieval activity.
  # Oct 20 (instructor): the form's option is renamed to "Oct 22 (Thu)" to match
  # the due date (read back with get_form). Reflections already filed carry the
  # old "Oct 20 (Tue) — Larsen et al, AI 2040: Plan A" label, so when they are
  # processed, merge both labels as one reading (the process-reflections skill
  # in comp440-main says so).
  - date: 2026-10-22
    form_option: "Oct 22 (Thu) — Larsen et al, AI 2040: Plan A"
    cite: 'Larsen, Dean, Halstead, Lifland, Greenblatt & Kokotajlo, "AI 2040: Plan A" (AI Futures Project)'
    label: article
    url: "https://ai-2040.com/"
  # Speaker days take ONE submission, not two (instructor, Sep 19, reversing the
  # Sep 7 rule). The reading is still assigned and still due before class, but it
  # is discussed inside the speaker questions, so it carries no reflection of its
  # own and no `form_option`. The build fails if one is added back.
  #
  # Set Sep 18. Four sources, one reflection — hence `sources`, not four entries.
  # The filing is the point: Brent Hecht is named and quoted in it three times as
  # "Microsoft's Director of Applied Science", which is the detail students are
  # asked to find. Verified Sep 18 by extracting the text of the PDF.
  # NYT gift link: the `unlocked_article_code` is what lets students read it
  # without a subscription, so it must be kept intact. Gift links expire; if it
  # stops working, get a fresh one from the instructor rather than dropping the
  # parameter.
  # Frank Schilder's visit. He sent this himself on Sep 16 and is revising it for
  # a journal; it is the knowledge-graphs-and-LLMs work he offered to talk about.
  # No `form_option`: speaker day, so it folds into the speaker questions.
  - date: 2026-10-08
    cite: 'Song, Bonifazi, Schilder & Schwarz, "Knowledge Graph-Assisted LLM Post-Training for Enhanced Legal Reasoning" (arXiv:2601.13806, Jan 2026)'
    url: "https://arxiv.org/abs/2601.13806"
  - date: 2026-09-29
    cite: 'background on Brent Hecht, and the News Plaintiffs brief in the OpenAI copyright MDL (Sep 17, 2026)'
    sources:
      - { text: his site, url: "https://brenthecht.com/" }
      - { text: LinkedIn, url: "https://www.linkedin.com/in/brenthecht/" }
      - { text: NYT, url: "https://www.nytimes.com/2026/09/17/technology/microsoft-openai-publishing-industry.html?unlocked_article_code=1.CFE.JvhY.hNmkpWFzgNCD&smid=url-share" }
      - { text: court filing, url: "https://storage.courtlistener.com/recap/gov.uscourts.nysd.640396/gov.uscourts.nysd.640396.1977.1.pdf" }
    note: >-
      The filing runs 92 pages. Find what it says about our speaker and what it
      says he said. You may use an AI agent to help you search it — for this
      document only, an exception to the no-AI rule. Check whatever it hands you
      against the filing itself, including the surrounding context, not just the
      line it quotes. The reflection is still your own writing.
  # Nick Vincent's visit. Set Oct 20 (instructor) as the required reading; an
  # optional second post sits on his row as a material. Title, author and date
  # (Oct 11, 2026) are the page's own, fetched Oct 20 (HTTP 200).
  # No `form_option`: speaker day, so it folds into the speaker questions.
  - date: 2026-10-27
    cite: 'Vincent, "How We Might Build “Augment, Don’t Replace” AI" (Data Leverage, Oct 11, 2026)'
    label: post
    url: "https://dataleverage.substack.com/p/how-we-might-build-augment-dont-replace"
  # Moved with Logan Stapleton from Sep 24 to Nov 24 (instructor, Sep 17).
  - date: 2026-11-24
    cite: 'Cheng, Stapleton, Kawakami et al, "How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions" (CHI 2022)'
    url: "https://dl.acm.org/doi/pdf/10.1145/3491102.3501831"

# Deadlines are declared here, once. The build joins them onto the grid above
# and fails if one no longer lands on a class meeting.
assignments:
  # `url` is used twice by the build: on the launch material and on the "HW0 due"
  # entry. Declare it here, never on a meeting row.
  - id: hw0
    title: HW0 — Working With Data and Claude
    launch: 2026-09-10
    due: 2026-09-17
    url: "https://github.com/shilad/comp440-hw0"
  - id: hw1
    title: HW1 — Collective Prediction
    launch: 2026-09-15
    due: 2026-10-01
    url: "https://github.com/shilad/comp440-hw1"
  # The Sep 24 in-class activity. Due date, "individual" and "counts as one
  # reading reflection or activity" are the README's, set by the instructor
  # Sep 23 night. Submitted through the form's "Activity submission" option.
  - id: ratings-influence
    title: "Activity — Ratings and Social Influence, a simulated market with Claude"
    label: Ratings and Social Influence activity due
    kind: activity
    launch: 2026-09-24
    due: 2026-10-06
    url: "https://github.com/shilad/comp440-ratings-influence"
  # The retrieval homework became a one-day in-class activity (instructor,
  # Sep 27), to give the final project more time; its grade weight moved to the
  # project. It is finished in class, so it has no `due:` (the syllabus:
  # in-class activities are due by the end of the session). The two later
  # homeworks were renumbered the same day: alignment is now HW2, the agent
  # assignment HW3.
  #
  # Oct 1 (instructor, "Coming up next" slide at the end of today's Word
  # Embeddings section): the activity moves from Oct 22 to Tue Oct 13, "we will
  # return to retrieval ... with a hands-on activity". HW2 is released Tue Oct 6,
  # with the intro to language models that helps launch it (was Oct 29). HW2
  # runs three weeks (instructor, Oct 1), so it was due Tue Oct 27 (was Nov 10).
  #
  # Oct 6 (instructor): HW2 is handed in in stages. Part 0 (setup; the README
  # called it Step 0, renamed by the instructor Oct 6) stays due Thu Oct 8, as
  # the HW2 README has it. Part 1 is due WEDNESDAY Oct 14, a day
  # the class does not meet ("yes, that's weird"); the Thursday after is Fall
  # Break. Hence `off_grid`, which shows it on Oct 13 with its own day. Part 2 is
  # due Thu Oct 29 (was Oct 27). Each part links to its own instructions page in
  # the public repo, read from `main` on Oct 6.
  #
  # Oct 13 (instructor, the morning of): the activity moves again, from Oct 13
  # to Tue Oct 20. Oct 13 became HW2 discussion and working time, the final
  # project introduction, and a discussion of "AI 2040: Plan A".
  #
  # Oct 20 (instructor): the activity runs in class today and is due Thu Oct 22
  # at 8:00am, so it now has a `due:`, and it links its public template repo
  # (built Oct 19; `main` is what students fork). Submitted through the form's
  # "Activity submission" option, with the activity's name and the repo URL, as
  # the README says.
  - id: retrieval
    title: "Activity — Representing and Retrieving Knowledge"
    label: Representing and Retrieving Knowledge activity due
    kind: activity
    launch: 2026-10-20
    due: 2026-10-22
    url: "https://github.com/shilad/comp440-retrieval"
  - id: hw2
    title: HW2 — Whose Preferences Count?
    launch: 2026-10-06
    url: "https://github.com/shilad/comp440-hw2"
    parts:
      - { label: HW2 Part 0 (setup) due, due: 2026-10-08,
          url: "https://github.com/shilad/comp440-hw2/blob/main/instructions/step0.md" }
      - { label: HW2 Part 1 due, due: 2026-10-14, off_grid: true,
          url: "https://github.com/shilad/comp440-hw2/blob/main/instructions/part1.md" }
      - { label: HW2 Part 2 due, due: 2026-10-29,
          url: "https://github.com/shilad/comp440-hw2/blob/main/instructions/part2.md" }
  - id: hw3
    title: HW3 — Building and Evaluating an Agent
    launch: 2026-11-10
    due: 2026-11-19

milestones:
