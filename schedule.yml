# COMP 440 schedule — single source of truth.
#
# You never type a meeting date. The calendar block below derives all 28 rows
# (Tue/Thu from `first` to `last`). Breaks are entries in the `meetings` list,
# so cancelling or inserting a class re-flows everything after it automatically.

course:
  code: COMP 440
  title: Collective Intelligence
  term: Fall 2026
  institution: Macalester College
  meets: Tuesday / Thursday, 1:20–2:50pm Central

# Course-level links, rendered as a row under the subtitle on every build. These are
# the things students need all semester and should never have to hunt for inside a
# meeting's materials cell. Order is by how often they are used, not importance.
# `url` only — these are not tied to a meeting, so no date validation applies.
# THE submission form — one surface for everything students hand in: homework,
# seminar reflections, reading reflections, speaker questions (instructor, Sep 8).
# Declared once here as a YAML anchor and referenced everywhere with `*submit`,
# so the links row, the speaker rows and every reading cannot drift apart. To
# change the form, change this line only.
submit_form: &submit "https://forms.gle/mgKcnqzTGxNaGvteA"

links:
  - { text: Submit work, url: *submit }
  - { text: Syllabus, url: "https://docs.google.com/document/d/1I1aXkTStnQKPQGWRKp3_M79QWn5x0wKLbJn8dGIZ7hU/edit" }
  - { text: AI guidelines, url: "https://docs.google.com/document/d/1Eb6qxeS2wy-9TBzL8eGk9j75iYu_yEV4VoLQaywRz8E/edit" }
  - { text: Office hours, url: "https://app.reclaim.ai/m/shilad/appointment" }
  # app_redirect resolves a channel by NAME, so this needs no channel ID and
  # survives the channel being recreated. Opens the desktop app if installed.
  - { text: "Slack #comp440-f26", url: "https://devgarden.slack.com/app_redirect?channel=comp440-f26" }

calendar:
  days: [Tue, Thu]
  first: 2026-09-08
  last: 2026-12-10
  # ONE deadline for everything: homework, project milestones, reading
  # reflections, speaker questions, forms. Stated here, rendered in the Due
  # column heading, and never repeated on a row. If some future item ever needs
  # a different time, give it its own `time:` and the build will annotate that
  # row alone.
  due_time: 8:00am Central

# Speaker days: the questions are forwarded to the speaker that morning, so they
# are due on the day of the visit, not the meeting before (instructor-confirmed
# Sep 7). `when` may be visit_day or prior_meeting. `items` are placed on every
# speaker row, in order; an empty list places nothing. No `due_time` — it
# inherits calendar.due_time like everything else.
speaker_due:
  when: visit_day
  items:
    - { label: Speaker questions due, url: *submit }

# Reflections. The obligation comes from the READING, not from the day — so a
# reflection deadline is placed by each entry in `readings:` below, and a meeting
# with no assigned reading correctly shows none.
reflections:
  form_url: *submit

# One entry per assigned reading. `date` is validated against the derived meeting
# grid like every other deadline. Renders in the Due column as
# `Read <cite> [paper | reflection]`.
readings:
  - date: 2026-09-10
    cite: 'Keshav et al, "How to Read a Paper"'
    url: "http://ccr.sigcomm.org/online/files/p83-keshavA.pdf"
  # NYT gift link: the `unlocked_article_code` is what lets students read it
  # without a subscription, so it must be kept intact. Gift links expire, and
  # this page is public — if it stops working, get a fresh one from the
  # instructor rather than dropping the parameter.
  - date: 2026-09-15
    cite: 'New York Times on OpenAI and the Navier-Stokes problem (Sep 10, 2026)'
    label: article
    url: "https://www.nytimes.com/2026/09/10/science/tristan-buckmaster-openai-math-navier-stokes.html?unlocked_article_code=1.AFE.0psT.2Ar5a-FHIo9p"
  - date: 2026-09-22
    cite: 'Steck, Baltrunas, Elahi, Liang, Raimond & Basilico, "Deep Learning for Recommender Systems: A Netflix Case Study" (AI Magazine, 2021)'
    url: "https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/18140"
  # Moved from Sep 22 with the cultural-markets session (instructor, Sep 17).
  # Nothing orphaned: no reflection had been submitted against the Sep 22 option.
  - date: 2026-09-24
    cite: 'Salganik, Dodds & Watts, "Experimental Study of Inequality and Unpredictability in an Artificial Cultural Market"'
    url: "https://www.filosofitis.com.ar/archivos/experimentalmarket.pdf"
  # Speaker days. The reading reflection and the speaker questions are both due
  # 8:00am, as two separate submissions (instructor, Sep 7).
  # No `url` yet: the build renders the reflection link alone, so students can see
  # a reading is coming. Replace the cite once the reading is chosen with Brent.
  - date: 2026-09-29
    cite: 'Background reading for Brent Hecht — to be announced'
  # Moved with Logan Stapleton from Sep 24 to Nov 24 (instructor, Sep 17).
  - date: 2026-11-24
    cite: 'Cheng, Stapleton, Kawakami et al, "How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions" (CHI 2022)'
    url: "https://dl.acm.org/doi/pdf/10.1145/3491102.3501831"

# Deadlines are declared here, once. The build joins them onto the grid above
# and fails if one no longer lands on a class meeting.
assignments:
  # `url` is used twice by the build: on the launch material and on the "HW0 due"
  # entry. Declare it here, never on a meeting row.
  - id: hw0
    title: HW0 — Working With Data and Claude
    launch: 2026-09-10
    due: 2026-09-17
    url: "https://github.com/shilad/comp440-hw0"
  - id: hw1
    title: HW1 — Collective Prediction
    launch: 2026-09-15
    due: 2026-10-01
  # Launch moves off Sep 29 because that day is now a whole-day guest speaker
  # with no class time to introduce an assignment. Due date skips Oct 15, which
  # is Fall Break, so the next legal deadline is Oct 20.
  - id: hw2
    title: HW2 — Representing and Retrieving Knowledge
    launch: 2026-10-01
    due: 2026-10-20
  - id: hw3
    title: HW3 — Whose Preferences Count?
    launch: 2026-10-29
    due: 2026-11-10
  - id: hw4
    title: HW4 — Building and Evaluating an Agent
    launch: 2026-11-10
    due: 2026-11-19

milestones:
  - { date: 2026-10-13, label: Final project introduced }
  - { date: 2026-11-12, label: Final project proposal due }
  - { date: 2026-11-24, label: Final project update }
  - { date: 2026-12-03, label: Project rehearsal }
  - { date: 2026-12-08, label: Final presentation materials }
  - { date: 2026-12-10, label: Final presentation materials }

other_due:
  - { date: 2026-09-10, label: Beginning-of-semester survey, url: "https://docs.google.com/forms/d/1V2s-wjjvZy4EY8aB25mUfXf2cqgGiPgcbaXVjErRsiM/viewform" }

# `speaker: true` marks a guest-speaker window. The `speaker_due` block above
# decides what is placed on it and when — never type a speaker deadline by hand.
meetings:
  - module: Foundations
    topic: "Course introduction: collective intelligence in the GenAI era"
    materials:
      - { text: Week 1 slides, url: "https://docs.google.com/presentation/d/1j_so7MZtkAcw5FCnTZ1ufR2zIlQTzMV-e3BPlJ4NluQ/view" }
      - { text: Course syllabus, url: "https://docs.google.com/document/d/1I1aXkTStnQKPQGWRKp3_M79QWn5x0wKLbJn8dGIZ7hU/edit" }
      - { text: "Working with AI (course AI policy)", url: "https://docs.google.com/document/d/1Eb6qxeS2wy-9TBzL8eGk9j75iYu_yEV4VoLQaywRz8E/edit" }
      - { text: Beginning-of-semester survey, url: "https://docs.google.com/forms/d/1V2s-wjjvZy4EY8aB25mUfXf2cqgGiPgcbaXVjErRsiM/viewform" }
      - { text: Wisdom of Crowds experiment, url: "https://docs.google.com/forms/d/1ATwZHFZMxh8OUXXtAASAezbDOHtjkQpfSuz3wRwKEJg/viewform" }
  - topic: Ways of knowing; working with Claude; reading and evidence
    materials:
      - { text: Week 1 slides, url: "https://docs.google.com/presentation/d/1j_so7MZtkAcw5FCnTZ1ufR2zIlQTzMV-e3BPlJ4NluQ/view" }
      - { text: "Ways of knowing: scenario worksheet", url: "https://docs.google.com/document/d/1zXG9C74k2Uq5zvvrpgJmCmK60l-J-t5Xz7LOogyqQT0/view" }
      - { text: AI norms activity, tbd: true }

  - module: Collective Traces
    # Latent factors lost its own session when cultural markets took Sep 22.
    # It is now a closing segment on Sep 17 that sets up Oct 1 (embeddings).
    topic: Ratings, aggregation, and prediction baselines
    materials:
      - { text: "Collective Traces slides", url: "https://docs.google.com/presentation/d/1JrSiDY4vfBrD1gZQdJ1HJBgXOH--dHrucCraZ0xR1Gg/view" }
      - { text: "Carbonated Beverages ratings sheet", url: "https://docs.google.com/spreadsheets/d/1AuPfdv9OtiXDKi9gi6ZuplRncg6heMmzqX4d9sVPE2Q/edit" }
      - { text: "Class AI agreements — ratify or amend", url: "https://docs.google.com/document/d/1JhAzzTbECGEE5IdOwabVJUh36YZ5DD6ozG_cvodqc9s/edit" }
  - topic: Similarity, neighborhoods, and latent factors
    materials:
      - { text: "Collective Traces slides", url: "https://docs.google.com/presentation/d/1JrSiDY4vfBrD1gZQdJ1HJBgXOH--dHrucCraZ0xR1Gg/view" }
      - { text: "Sep 17 slides: similarity, neighborhoods, latent factors", url: "https://docs.google.com/presentation/d/1NuOWNmFWZvpGPLB601Nu1ADlKhcM5A1AadOHqKgcf8g/view" }
      - { text: "Fall 2026 Pop Ratings", url: "https://claude.ai/artifact/NUyHC2avZzNwUPvou5xXbb" }
      - { text: "latent factors: full session Sep 22", tbd: true }
  # Sep 22. New session (instructor, Sep 17): latent factors stop being a closing
  # segment on Sep 17 and get a whole day, carried through to neural models.
  - topic: Latent factors and deep learning for recommenders
    materials:
      - { text: latent factors and deep recommender materials, tbd: true }
  # Sep 24. Pushed here from Sep 22 by the session above.
  - topic: Cultural markets, social influence, and feedback simulation
    materials:
      - { text: in-class cultural-market simulation, tbd: true }

  # Sep 29. Retrieval now opens on the speaker, because deep recommenders took
  # Sep 22 and pushed everything before Brent's fixed date one session later.
  - module: Retrieval
    topic: Guest speaker session
    speaker: Brent Hecht
    materials:
      - { text: background reading (to be set with speaker), tbd: true }
  # Oct 1. Keeps a full session of its own (instructor, Sep 17) rather than being
  # folded into embeddings.
  - topic: TF-IDF, BM25, and lexical retrieval
    materials:
      - { text: lexical retrieval activity, tbd: true }
  # Oct 6.
  - topic: Embeddings and semantic similarity
    materials:
      - { text: embeddings activity, tbd: true }
  # Oct 8. Frank's date is fixed, so he sits BEFORE the RAG session now.
  - topic: Guest speaker session
    speaker: Frank Schilder (tentative)
    materials:
      - { text: background reading (to be set with speaker), tbd: true }
  # Oct 13. Absorbs "Retrieval evaluation and data provenance", which lost its
  # own session when Oct 8 became a speaker day (instructor, Sep 15).
  - topic: Hybrid retrieval, RAG, evaluation, and data provenance
    materials:
      - { text: RAG activity, tbd: true }
      - { text: evaluation activity, tbd: true }
  - break: Fall Break

  # Unfolded again (instructor, Sep 17). The Sep 22 session was briefly paid for
  # by folding this overview into transformers; it no longer has to be, because
  # training data, labor and authorship moved onto Nick Vincent's visit and gave
  # Oct 22 back. Entry count between Fall Break and Oct 27 is unchanged, so no
  # speaker or break moves.
  - module: Foundation Models
    topic: From representations and prediction to language models
    materials:
      - { text: language-model overview, tbd: true }
  - topic: Transformers, pretraining, and generation
    materials:
      - { text: foundation-model materials, tbd: true }
  # Nick Vincent covers training data, labor and authorship with the class
  # (instructor, Sep 17), so his visit closes Foundation Models rather than
  # opening Alignment, and the topic is named on the row so students know what
  # the day is. His date does not change.
  - topic: "Guest speaker session: training data, labor, and authorship"
    speaker: Nick Vincent (tentative)
    materials:
      - { text: data / labor reading (to be set with speaker), tbd: true }

  # Absorbs "Instruction tuning and supervised fine-tuning", displaced when
  # Oct 27 became a speaker day. Also the day HW3 now launches.
  - module: Alignment
    topic: "Instruction tuning and supervised fine-tuning; preference data, constitutions, and disagreement"
    materials:
      - { text: SFT lab, tbd: true }
      - { text: preference-labeling activity, tbd: true }
      - { text: "Class AI agreements — reread alongside HW3", url: "https://docs.google.com/document/d/1JhAzzTbECGEE5IdOwabVJUh36YZ5DD6ozG_cvodqc9s/edit" }
  - topic: Direct Preference Optimization and model alignment
    materials:
      - { text: DPO lab, tbd: true }
  # Was the sixth speaker window; dropped Sep 15, so this is a full teaching day
  # again and the module's lab meetings no longer collide with a visit.
  - topic: Blind evaluation and pluralistic alignment
    materials:
      - { text: blind evaluation, tbd: true }

  - module: Agents
    topic: RAG, tools, and agent workflows
    materials:
      - { text: agent introduction, tbd: true }
  - topic: Guest speaker session
    speaker: President Rivera
    materials:
      - { text: background reading (to be set with speaker), tbd: true }
  - topic: Memory, planning, control, and agent evaluation
    materials:
      - { text: agent evaluation activity, tbd: true }
  # Absorbs "Agents in work and organizations", displaced when the module's
  # speaker day moved from Nov 19 to Nov 12.
  - topic: Human–AI collaboration, delegation, and agents in organizations
    materials:
      - { text: comparative experiment, tbd: true }
      - { text: organizational case, tbd: true }

  - module: Collective Systems
    topic: Guest speaker session
    speaker: Logan Stapleton
    materials:
      - { text: "Logan Stapleton — personal site", url: "https://loganstapleton.com/" }
      - { text: "Logan Stapleton — Vassar faculty page", url: "https://www.vassar.edu/faculty/lstapleton" }
  - break: Thanksgiving Break
  # The last teaching day of the module, and the only one left: Logan takes
  # Nov 24 and Rock takes Dec 3. Three topics want it and one day is available,
