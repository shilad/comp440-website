  # all three. Social networks was displaced by Logan's move (instructor,
  # Sep 17: "that part of the semester is pretty tba").
  - topic: "Options: diffusion, feedback, and agent-based simulation · social networks and multi-agent systems · governance, law, and institutions"
    materials:
      - { text: in-class simulation activity, tbd: true }
      - { text: network analysis activity, tbd: true }
      - { text: governance reading, tbd: true }
  - topic: Guest speaker session
    speaker: Yuren (Rock) Pang
    materials:
      - { text: background reading (to be set with speaker), tbd: true }

  - module: Synthesis
    topic: Final presentations, day 1
  - topic: Final presentations, day 2; course synthesis
    materials:
      - { text: "Class AI agreements — final reread", url: "https://docs.google.com/document/d/1JhAzzTbECGEE5IdOwabVJUh36YZ5DD6ozG_cvodqc9s/edit" }
      - { text: "Day 1 shared doc — final reread", tbd: true }
