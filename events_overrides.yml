# Instructor overrides on the generated MSCS events.
#
# `counts:` marks an event as satisfying the capstone seminar requirement.
# `hidden:` drops an event from the rail entirely.
# `posters:` links an event's title to its poster in the MSCS shared drive.
#
# The syllabus requires students to "attend and subsequently submit a short
# reflection for at least 2 MSCS seminars, or other related presentations upon
# instructor approval." That is a judgement call per event, so it is curated
# here BY HAND rather than guessed from a title.
#
# This file is hand-edited and survives a refresh. `events.yml` is generated and
# gets overwritten every time tools/fetch_events.py runs, so neither list can
# live there. `hidden:` is applied by the fetch tool, so a dropped event still
# appears under `skipped:` in events.yml with its reason; `counts:` is matched
# on at build time.
#
# TO ADD ONE: a date and enough of the title to identify it unambiguously.
# The match is case-insensitive substring on that date. The build FAILS if an
# entry matches no event or more than one, so a typo or a moved event is caught
# rather than silently dropping the credit.
#
# COMP 440's own guest speakers do NOT count (instructor, Sep 9). They are part
# of class, not a seminar the student chose to attend. They never appear here,
# and the rail says so out loud, because a student could reasonably assume a
# guest speaker is exactly what "attend a talk" means.

counts:
  - { date: 2026-09-24, title: "Smail Gallery Artist Talk" }
  - { date: 2026-09-24, title: "Software Engineering Technical Interview Workshop" }
  - { date: 2026-11-10, title: "MSCS & Society talk" }

# DELIBERATELY NOT MARKED — do not add these without asking:
#
#   Nov 9, "Hutchinson & Wagon square-wheel bike student reception" — ruled out by
#   the instructor Sep 9. It is the reception for the same speaker as the Nov 10
#   talk, the evening before, which makes it the easiest thing here to add by
#   mistake. A reception is not a talk.
#
#   Nov 1, "MSCS & Society Speaker Event" — undecided. Same series as the Nov 10
#   talk that does count, so it plausibly counts, but the instructor named the
#   Nov 10 one specifically and this file is the wrong place to guess.

# Event posters. Staff drop these into the MSCS shared drive's month folders
# (`1gjYWAuEE0Lepkg3fXtToutzUtKdDl9xC`), one folder per month. Matched on date +
# title exactly like `counts:`, and a miss is a build failure for the same reason.
#
# THE SHARING CHECK IS NOT OPTIONAL AND THE BUILD CANNOT DO IT — it never touches
# the network. Check by hand before adding an entry and record the date in
# `checked:`; the build refuses an entry without one.
#
# The bar is invariant 4's: the file is **shared with students**. These posters are
# `macalester.edu` domain-reader, inherited from a parent folder, which every student
# in the class satisfies by being signed into their Mac account. That is enough, and
# the instructor confirmed it (Sep 13). Do not hold a poster back for not being
# "anyone with the link" — an earlier version of this comment demanded that, which is
# stricter than the invariant asks and is not the standard in use.
#
# What the domain grant does cost: a visitor who is NOT signed into a Macalester
# account — a prospective student, a parent — gets a Google sign-in page instead of
# the poster. Accepted, because they are not who this page is for.
#
# Re-check if a poster is re-uploaded. A new upload is a new file: it inherits the
# folder's sharing, but its id changes, so the entry here points at a file nobody
# is maintaining any more.
#
# Record `drive_id`, not a URL. The build makes the /view link, so no editor path
# can slip in.
posters:
  # Verified macalester.edu domain-reader on 2026-09-13 via the Drive API, not by
  # opening them — opening one proves nothing when you are already signed in.
  - { date: 2026-09-16, title: "Million Dollar Problem",
      drive_id: 1HOhbFJn9qXtIx9CZIi1TfXeCZHALtSzL, checked: 2026-09-13 }
  - { date: 2026-09-17, title: "Outside Edition",
      drive_id: 1VG_sp4g1ZB8pM8AjAJVP7JBsIOX49X4v, checked: 2026-09-13 }
  - { date: 2026-11-10, title: "MSCS & Society talk",
      drive_id: 15lgsdcB8eAV8sIu6VfUhSznNdM2Ubin_, checked: 2026-09-13 }

# NOT LINKED: "POSTER Job & Internship Fair Macalester Fall 2026.jpg"
# (1R02HxndsicWEWDDIucEACTDDJnbcvbtc), a college-wide Career Exploration event on
# Tue Sep 22. It has no entry on the MSCS calendar at all, so there is no rail event
# to hang it on, and the instructor chose to leave it off (Sep 13). Recorded here so
# the next pass does not re-derive why the fourth poster in the folder is missing.

# Events that should not appear at all. The department calendar is not curated for
# students, so an entry can be plain wrong; hiding it here keeps it out of the rail
# and records why, rather than someone re-adding it after the next refresh.
#
# OMIT `date` to hide every occurrence of a title — that is how a weekly series is
# dropped. With a date it would take one entry per occurrence, and whatever the
# department adds next term would quietly come back. Hidden events still appear
# under `skipped:` in events.yml, one line per occurrence, with the reason below.
hidden:
  - { date: 2026-11-01, title: "MSCS & Society Speaker Event",
      reason: "wrong entry on the department calendar (instructor, Sep 10)" }
  - { title: "RStudio Drop In Hours",
      reason: "weekly tutoring hours, not a department event (instructor, Sep 13). 22 occurrences would more than double the rail and bury the talks it exists to surface." }
